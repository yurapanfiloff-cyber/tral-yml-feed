name: Generate YML feed

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Опубликовать после ручной проверки, даже если число оферов уменьшилось более чем на 20%"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tral-yml-feed-pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Получить проект
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить генератор
        run: python -m unittest -v

      - name: Подготовить каталоги
        run: |
          mkdir -p public runtime
          if [ ! -f public/direct.xml ]; then
            if [ -f public/direct.yml ]; then
              cp public/direct.yml public/direct.xml
            elif [ -f runtime/direct.yml ]; then
              cp runtime/direct.yml public/direct.xml
            fi
          fi

      - name: Получить предыдущий рабочий фид
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 15 --max-time 60 \
            https://feed.tral-diler.ru/direct.xml \
            --output /tmp/current-direct.xml
          python -c "from lxml import etree; etree.parse('/tmp/current-direct.xml')"
          mv /tmp/current-direct.xml public/direct.xml

      - name: Сформировать фид
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.force_publish != true }}
        run: python feed_generator.py --config config.github.json

      - name: Сформировать фид с ручным подтверждением
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish == true }}
        run: python feed_generator.py --config config.github.json --force-publish

      - name: Создать резервный адрес .yml
        run: cp public/direct.xml public/direct.yml

      - name: Сохранить отчёты запуска
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: feed-run-${{ github.run_number }}
          path: |
            public/audit.json
            public/status.json
            runtime/generator.log
          if-no-files-found: warn
          retention-days: 30

      - name: Убрать резервную копию из публикации
        run: rm -f public/direct.xml.previous

      - name: Сохранить рабочую версию в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/direct.xml public/direct.yml public/audit.json public/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published feed state [skip ci]"
            git push
          fi

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовить публикацию
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Опубликовать рабочий фид
        id: deployment
        uses: actions/deploy-pages@v4
