server {
    listen 80;
    server_name feed.tral-diler.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name feed.tral-diler.ru;

    ssl_certificate /etc/letsencrypt/live/feed.tral-diler.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feed.tral-diler.ru/privkey.pem;

    root /var/www/feed.tral-diler.ru/public;

    location = /direct.yml {
        try_files /direct.yml =404;
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
